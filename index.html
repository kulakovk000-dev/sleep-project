<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SleepTime — калькулятор сна</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top left, #3d50a5 0%, transparent 35%),
                linear-gradient(135deg, #080d2b, #151044 55%, #25145c);
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: 0 auto;
            padding: 35px 0 50px;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .moon {
            margin-bottom: 10px;
            font-size: 58px;
        }

        h1 {
            margin: 0;
            font-size: 38px;
        }

        .subtitle {
            margin-top: 12px;
            color: #c9cdf5;
            font-size: 17px;
        }

        .card {
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
        }

        .form-title {
            margin-top: 0;
            text-align: center;
            font-size: 23px;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            color: #e0e2ff;
            font-size: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 14px 16px;
            color: white;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            font-size: 17px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #a9b2ff;
        }

        option {
            color: black;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            color: white;
            background: linear-gradient(90deg, #6675ee, #8e5ce6);
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .result {
            margin-top: 28px;
            padding: 22px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.2);
        }

        .result h2 {
            margin-top: 0;
            text-align: center;
            font-size: 22px;
        }

        .time-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            margin-top: 18px;
        }

        .time-item {
            padding: 16px;
            text-align: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.12);
        }

        .time {
            display: block;
            margin-bottom: 5px;
            color: #ffffff;
            font-size: 27px;
            font-weight: bold;
        }

        .cycles {
            color: #cdd1ff;
            font-size: 14px;
        }

        .info {
            margin-top: 25px;
            color: #cdd1ff;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }

        footer {
            margin-top: 28px;
            color: #aeb4e8;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding-top: 22px;
            }

            h1 {
                font-size: 30px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="header">
            <div class="moon">🌙</div>

            <h1>SleepTime</h1>

            <p class="subtitle">
                Рассчитайте лучшее время для отхода ко сну
            </p>
        </header>

        <section class="card">
            <h2 class="form-title">
                Во сколько вы хотите проснуться?
            </h2>

            <form id="sleepForm">
                <label for="wakeTime">
                    Время пробуждения
                </label>

                <input
                    type="time"
                    id="wakeTime"
                    value="07:00"
                    required
                >

                <label for="cycles">
                    Количество циклов сна
                </label>

                <select id="cycles">
                    <option value="4">
                        4 цикла — около 6 часов
                    </option>

                    <option value="5" selected>
                        5 циклов — около 7,5 часов
                    </option>

                    <option value="6">
                        6 циклов — около 9 часов
                    </option>
                </select>

                <button type="submit">
                    Рассчитать время сна
                </button>
            </form>

            <div
                class="result"
                id="result"
                style="display: none;"
            >
                <h2>
                    Рекомендуемые варианты
                </h2>

                <div
                    class="time-list"
                    id="timeList"
                ></div>
            </div>

            <p class="info">
                Один цикл сна длится примерно 90 минут.
                Мы также добавляем около 15 минут на засыпание.
            </p>
        </section>

        <footer>
            SleepTime © 2025
        </footer>
    </main>

    <script>
        const sleepForm = document.getElementById("sleepForm");
        const wakeTimeInput = document.getElementById("wakeTime");
        const cyclesInput = document.getElementById("cycles");
        const resultBlock = document.getElementById("result");
        const timeList = document.getElementById("timeList");

        function formatTime(date) {
            const hours = String(date.getHours()).padStart(2, "0");
            const minutes = String(date.getMinutes()).padStart(2, "0");

            return `${hours}:${minutes}`;
        }

        function calculateBedtime(wakeTime, cycles) {
            const [hours, minutes] = wakeTime.split(":").map(Number);

            /*
             * Используем условную дату.
             * Это позволяет правильно считать время,
             * даже если отход ко сну был накануне.
             */
            const wakeDate = new Date(2000, 0, 2, hours, minutes);

            const sleepDuration =
                cycles * 90 + 15;

            const bedtime = new Date(
                wakeDate.getTime() - sleepDuration * 60 * 1000
            );

            return formatTime(bedtime);
        }

        function showResult() {
            const wakeTime = wakeTimeInput.value;
            const selectedCycles = Number(cyclesInput.value);

            if (!wakeTime) {
                return;
            }

            const cyclesList = [
                selectedCycles - 1,
                selectedCycles,
                selectedCycles + 1
            ];

            timeList.innerHTML = "";

            cyclesList.forEach(function(cycles) {
                if (cycles < 3 || cycles > 7) {
                    return;
                }

                const bedtime = calculateBedtime(
                    wakeTime,
                    cycles
                );

                const item = document.createElement("div");
                item.className = "time-item";

                item.innerHTML = `
                    <span class="time">${bedtime}</span>
                    <span class="cycles">
                        ${cycles} циклов сна
                    </span>
                `;

                timeList.appendChild(item);
            });

            resultBlock.style.display = "block";
        }

        sleepForm.addEventListener("submit", function(event) {
            event.preventDefault();
            showResult();
        });

        showResult();
    </script>
</body>
</html>
